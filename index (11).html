<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#041327">
<title>Pelaporan Kokurikulum SKSBJ 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#041327;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden}
.wrap{max-width:1846px;margin:0 auto}
.stage{position:relative;width:100%}
.stage img{display:block;width:100%;height:auto}

.portal-btn{
  position:absolute;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.65em;
  text-decoration:none;
  color:#fff;
  font-weight:950;
  letter-spacing:.025em;
  font-size:clamp(.8rem,1.55vw,1.55rem);
  border-radius:999px;
  height:9.2%;
  box-shadow:0 0 22px var(--glow), inset 0 1px rgba(255,255,255,.5);
  border:2px solid rgba(255,255,255,.65);
  text-shadow:0 2px 6px rgba(0,0,0,.45);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(255,255,255,.15);
  transition:transform .18s ease, box-shadow .18s ease;
}
.portal-btn:hover{transform:translateY(-2px) scale(1.015)}
.portal-btn:active{transform:scale(.985)}
.portal-btn::after{
  content:"›";
  font-size:1.65em;
  line-height:1;
  margin-left:.15em;
}

.desktop .portal-btn{bottom:3.15%}
.desktop .sukan{left:4.0%;width:27.0%;background:linear-gradient(180deg,#18baff,#006bdc);--glow:#00b7ff}
.desktop .kelab{left:36.2%;width:27.8%;background:linear-gradient(180deg,#ff3ad8,#9a0cce);--glow:#ff24c8}
.desktop .uniform{left:69.1%;width:27.1%;background:linear-gradient(180deg,#ffbe22,#db7800);--glow:#ffae00}

.mobile{display:none}
.mobile-section{position:relative;width:100%;background:#061424}
.mobile-section img{display:block;width:100%;height:auto}
.mobile-section .portal-btn{
  left:8%;
  width:84%;
  bottom:3.8%;
  height:11%;
  min-height:48px;
  font-size:clamp(1rem,4.5vw,1.35rem);
}
.mobile-section.sukan-card .portal-btn{background:linear-gradient(180deg,#18baff,#006bdc);--glow:#00b7ff}
.mobile-section.kelab-card .portal-btn{background:linear-gradient(180deg,#ff3ad8,#9a0cce);--glow:#ff24c8}
.mobile-section.uniform-card .portal-btn{background:linear-gradient(180deg,#ffbe22,#db7800);--glow:#ffae00}

footer{
 text-align:center;padding:16px 10px 22px;color:#7f95ae;
 font-size:.72rem;letter-spacing:.2em;text-transform:uppercase
}

@media(max-width:900px){
 .desktop{display:none}
 .mobile{display:block}
 footer{font-size:.64rem}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="stage desktop" aria-label="Portal Kokurikulum SKSBJ 2026">
    <img src="assets/portal-final.jpg" alt="Pelaporan Kokurikulum SKSBJ 2026">
    <a class="portal-btn sukan" href="https://script.google.com/macros/s/AKfycbw44zmumY3SuJcRVjWst9u9KVtTkVXJdgMmurOPeB3D1i06i5fhSab0G_lveYHdy58g/exec" target="_blank" rel="noopener">BUKA PORTAL</a>
    <a class="portal-btn kelab" href="https://script.google.com/macros/s/AKfycbxFC-WBAX5i4An0_vc890VHEd5xaTMSa_-Yofiu3u2h9HJP4sKSOJeuVs-w_2YGfmMS/exec" target="_blank" rel="noopener">BUKA PORTAL</a>
    <a class="portal-btn uniform" href="https://script.google.com/macros/s/AKfycbwiCWI6RNphgxjncSKWqwwhjjLZJc-UFserR9wbj3_lFvIzFMZr_Ist9MYE6bW-GkSiAg/exec" target="_blank" rel="noopener">BUKA PORTAL</a>
  </section>

  <section class="mobile" aria-label="Versi mudah alih">
    <div class="mobile-section">
      <img src="assets/mobile-hero.jpg" alt="Pelaporan Kokurikulum SKSBJ 2026">
    </div>

    <div class="mobile-section sukan-card">
      <img src="assets/mobile-sukan.jpg" alt="Sukan dan Permainan">
      <a class="portal-btn" href="https://script.google.com/macros/s/AKfycbw44zmumY3SuJcRVjWst9u9KVtTkVXJdgMmurOPeB3D1i06i5fhSab0G_lveYHdy58g/exec" target="_blank" rel="noopener">BUKA PORTAL</a>
    </div>

    <div class="mobile-section kelab-card">
      <img src="assets/mobile-kelab.jpg" alt="Kelab dan Persatuan">
      <a class="portal-btn" href="https://script.google.com/macros/s/AKfycbxFC-WBAX5i4An0_vc890VHEd5xaTMSa_-Yofiu3u2h9HJP4sKSOJeuVs-w_2YGfmMS/exec" target="_blank" rel="noopener">BUKA PORTAL</a>
    </div>

    <div class="mobile-section uniform-card">
      <img src="assets/mobile-uniform.jpg" alt="Badan Beruniform">
      <a class="portal-btn" href="https://script.google.com/macros/s/AKfycbwiCWI6RNphgxjncSKWqwwhjjLZJc-UFserR9wbj3_lFvIzFMZr_Ist9MYE6bW-GkSiAg/exec" target="_blank" rel="noopener">BUKA PORTAL</a>
    </div>
  </section>

  <footer>SK SERI BINJAI · BATU PAHAT · 2026</footer>
</main>
</body>
</html>
