<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#041328">
  <title>Pelaporan Kokurikulum SKSBJ 2026</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#031225;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100vh;overflow-x:hidden;background:
      radial-gradient(circle at 30% 0%, rgba(0,183,255,.16), transparent 30rem),
      radial-gradient(circle at 90% 20%, rgba(255,176,0,.08), transparent 22rem),
      #031225;}
    .wrap{max-width:1800px;margin:0 auto;padding:0}
    .stage{position:relative;width:100%;margin:0 auto}
    .stage img{display:block;width:100%;height:auto}
    .hotspot{
      position:absolute;
      display:block;
      border-radius:999px;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }
    .hotspot:focus-visible{outline:3px solid #fff;outline-offset:3px}
    /* Desktop hotspot positions based on the final banner */
    .desktop{display:block}
    .mobile{display:none}
    .desktop .sukan{left:2.1%; top:80.6%; width:25.1%; height:8.2%}
    .desktop .kelab{left:35.6%; top:80.8%; width:28.8%; height:8.1%}
    .desktop .uniform{left:68.1%; top:80.5%; width:28.3%; height:8.4%}

    /* Mobile: use the same artwork full width, with resized hotspots */
    .mobile .sukan{left:4.8%; top:80.7%; width:25.3%; height:8.3%}
    .mobile .kelab{left:36.0%; top:80.8%; width:28.9%; height:8.2%}
    .mobile .uniform{left:68.0%; top:80.5%; width:28.4%; height:8.5%}

    footer{
      text-align:center;
      color:#7c92ad;
      font-size:.75rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      padding:18px 12px 24px;
    }

    @media (max-width: 900px){
      .desktop{display:none}
      .mobile{display:block}
      footer{font-size:.68rem}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="stage desktop" aria-label="Portal Pelaporan Kokurikulum SKSBJ 2026">
      <img src="assets/portal-banner.jpg" alt="Pelaporan Kokurikulum SKSBJ 2026">
      <a class="hotspot sukan" href="https://script.google.com/macros/s/AKfycbw44zmumY3SuJcRVjWst9u9KVtTkVXJdgMmurOPeB3D1i06i5fhSab0G_lveYHdy58g/exec" target="_blank" rel="noopener" aria-label="Buka portal Sukan dan Permainan"></a>
      <a class="hotspot kelab" href="https://script.google.com/macros/s/AKfycbxFC-WBAX5i4An0_vc890VHEd5xaTMSa_-Yofiu3u2h9HJP4sKSOJeuVs-w_2YGfmMS/exec" target="_blank" rel="noopener" aria-label="Buka portal Kelab dan Persatuan"></a>
      <a class="hotspot uniform" href="https://script.google.com/macros/s/AKfycbwiCWI6RNphgxjncSKWqwwhjjLZJc-UFserR9wbj3_lFvIzFMZr_Ist9MYE6bW-GkSiAg/exec" target="_blank" rel="noopener" aria-label="Buka portal Badan Beruniform"></a>
    </section>

    <section class="stage mobile" aria-label="Portal Pelaporan Kokurikulum SKSBJ 2026 Mobile">
      <img src="assets/portal-banner-mobile.jpg" alt="Pelaporan Kokurikulum SKSBJ 2026">
      <a class="hotspot sukan" href="https://script.google.com/macros/s/AKfycbw44zmumY3SuJcRVjWst9u9KVtTkVXJdgMmurOPeB3D1i06i5fhSab0G_lveYHdy58g/exec" target="_blank" rel="noopener" aria-label="Buka portal Sukan dan Permainan"></a>
      <a class="hotspot kelab" href="https://script.google.com/macros/s/AKfycbxFC-WBAX5i4An0_vc890VHEd5xaTMSa_-Yofiu3u2h9HJP4sKSOJeuVs-w_2YGfmMS/exec" target="_blank" rel="noopener" aria-label="Buka portal Kelab dan Persatuan"></a>
      <a class="hotspot uniform" href="https://script.google.com/macros/s/AKfycbwiCWI6RNphgxjncSKWqwwhjjLZJc-UFserR9wbj3_lFvIzFMZr_Ist9MYE6bW-GkSiAg/exec" target="_blank" rel="noopener" aria-label="Buka portal Badan Beruniform"></a>
    </section>

    <footer>SK SERI BINJAI · BATU PAHAT · 2026</footer>
  </main>
</body>
</html>
