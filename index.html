<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#041327">
<title>Pelaporan Kokurikulum SKSBJ 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#041327;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden}
.wrap{max-width:1846px;margin:0 auto}
.stage{position:relative;width:100%}
.stage img{display:block;width:100%;height:auto}
.hot{
 position:absolute;z-index:20;display:block;border-radius:999px;
 background:rgba(255,255,255,.001);cursor:pointer;touch-action:manipulation;
 -webkit-tap-highlight-color:rgba(255,255,255,.12)
}
/* Desktop hotspots */
.desktop .sukan{left:4.7%;top:84.2%;width:24.8%;height:10.2%}
.desktop .kelab{left:36.4%;top:84.2%;width:24.8%;height:10.2%}
.desktop .uniform{left:70.0%;top:84.2%;width:24.8%;height:10.2%}

.mobile{display:none}
.mobile-section{position:relative;width:100%;background:#061424}
.mobile-section img{display:block;width:100%;height:auto}
.mobile-section .hot{left:6%;bottom:5%;width:88%;height:17%}

footer{
 text-align:center;padding:16px 10px 22px;color:#7f95ae;
 font-size:.72rem;letter-spacing:.2em;text-transform:uppercase
}

@media(max-width:900px){
 .desktop{display:none}
 .mobile{display:block}
 footer{font-size:.64rem}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="stage desktop" aria-label="Portal Kokurikulum SKSBJ 2026">
    <img src="assets/portal-final.jpg" alt="Pelaporan Kokurikulum SKSBJ 2026">
    <a class="hot sukan" href="https://script.google.com/macros/s/AKfycbw44zmumY3SuJcRVjWst9u9KVtTkVXJdgMmurOPeB3D1i06i5fhSab0G_lveYHdy58g/exec" target="_blank" rel="noopener" aria-label="Buka portal Sukan dan Permainan"></a>
    <a class="hot kelab" href="https://script.google.com/macros/s/AKfycbxFC-WBAX5i4An0_vc890VHEd5xaTMSa_-Yofiu3u2h9HJP4sKSOJeuVs-w_2YGfmMS/exec" target="_blank" rel="noopener" aria-label="Buka portal Kelab dan Persatuan"></a>
    <a class="hot uniform" href="https://script.google.com/macros/s/AKfycbwiCWI6RNphgxjncSKWqwwhjjLZJc-UFserR9wbj3_lFvIzFMZr_Ist9MYE6bW-GkSiAg/exec" target="_blank" rel="noopener" aria-label="Buka portal Badan Beruniform"></a>
  </section>

  <section class="mobile" aria-label="Versi mudah alih">
    <div class="mobile-section">
      <img src="assets/mobile-hero.jpg" alt="Pelaporan Kokurikulum SKSBJ 2026">
    </div>
    <div class="mobile-section">
      <img src="assets/mobile-sukan.jpg" alt="Sukan dan Permainan">
      <a class="hot" href="https://script.google.com/macros/s/AKfycbw44zmumY3SuJcRVjWst9u9KVtTkVXJdgMmurOPeB3D1i06i5fhSab0G_lveYHdy58g/exec" target="_blank" rel="noopener" aria-label="Buka portal Sukan dan Permainan"></a>
    </div>
    <div class="mobile-section">
      <img src="assets/mobile-kelab.jpg" alt="Kelab dan Persatuan">
      <a class="hot" href="https://script.google.com/macros/s/AKfycbxFC-WBAX5i4An0_vc890VHEd5xaTMSa_-Yofiu3u2h9HJP4sKSOJeuVs-w_2YGfmMS/exec" target="_blank" rel="noopener" aria-label="Buka portal Kelab dan Persatuan"></a>
    </div>
    <div class="mobile-section">
      <img src="assets/mobile-uniform.jpg" alt="Badan Beruniform">
      <a class="hot" href="https://script.google.com/macros/s/AKfycbwiCWI6RNphgxjncSKWqwwhjjLZJc-UFserR9wbj3_lFvIzFMZr_Ist9MYE6bW-GkSiAg/exec" target="_blank" rel="noopener" aria-label="Buka portal Badan Beruniform"></a>
    </div>
  </section>

  <footer>SK SERI BINJAI · BATU PAHAT · 2026</footer>
</main>
</body>
</html>
